kind = "web"
previewPath = "/"
title = "Appointment Reminder"
version = "1.0.0"
id = "artifacts/appointments"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19539

[services.development]
run = "pnpm --filter @workspace/appointments run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/appointments", "run", "build" ]
publicDir = "artifacts/appointments/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19539"
BASE_PATH = "/"
