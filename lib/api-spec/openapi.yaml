openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: WhatsApp Appointment Reminder API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: appointments
    description: Appointment management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List all appointments
      description: Returns all appointments sorted by appointment time descending
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Create a new appointment
      description: Creates appointment, saves to DB, and sends a WhatsApp/SMS confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /appointments/{id}:
    get:
      operationId: getAppointment
      tags: [appointments]
      summary: Get an appointment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Appointment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /appointments/{id}/remind:
    post:
      operationId: sendReminder
      tags: [appointments]
      summary: Manually trigger a reminder for an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reminder sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /appointments/stats/summary:
    get:
      operationId: getAppointmentStats
      tags: [appointments]
      summary: Get appointment statistics
      description: Returns counts of total, upcoming, and past appointments
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Appointment:
      type: object
      required:
        - id
        - customerName
        - phoneNumber
        - appointmentTime
        - createdAt
        - confirmationSent
        - reminderSent
      properties:
        id:
          type: integer
        customerName:
          type: string
        phoneNumber:
          type: string
        appointmentTime:
          type: string
          format: date-time
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        confirmationSent:
          type: boolean
        reminderSent:
          type: boolean
        messageSid:
          type: ["string", "null"]

    AppointmentInput:
      type: object
      required:
        - customerName
        - phoneNumber
        - appointmentTime
      properties:
        customerName:
          type: string
          minLength: 1
        phoneNumber:
          type: string
          minLength: 7
        appointmentTime:
          type: string
          format: date-time
        notes:
          type: string

    AppointmentStats:
      type: object
      required:
        - total
        - upcoming
        - past
        - confirmationsSent
        - remindersSent
      properties:
        total:
          type: integer
        upcoming:
          type: integer
        past:
          type: integer
        confirmationsSent:
          type: integer
        remindersSent:
          type: integer

    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
